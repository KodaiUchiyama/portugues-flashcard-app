<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#009c3b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>🇧🇷 ポルトガル語フラッシュカード</title>
  <style>
    :root {
      --green:        #009c3b;
      --green-light:  #dcfce7;
      --green-border: #86efac;
      --blue:         #002776;
      --blue-light:   #dbeafe;
      --red-light:    #fee2e2;
      --red-border:   #fca5a5;
      --bg:           #f0f4f8;
      --surface:      #ffffff;
      --text:         #1a1a2e;
      --muted:        #6b7280;
      --border:       #e5e7eb;
      --shadow-sm:    0 1px 3px rgba(0,0,0,.10);
      --shadow-md:    0 4px 16px rgba(0,0,0,.12);
      --shadow-lg:    0 10px 36px rgba(0,0,0,.16);
      --r-sm: 8px;
      --r-md: 14px;
      --r-lg: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-text-size-adjust: 100%;
    }

    /* ---- Screens ---- */
    .screen {
      display: none;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px 16px max(40px, env(safe-area-inset-bottom, 40px));
      padding-left:  max(16px, env(safe-area-inset-left, 16px));
      padding-right: max(16px, env(safe-area-inset-right, 16px));
    }
    .screen.active { display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 480px; }

    /* ---- App Header ---- */
    .app-header { text-align: center; padding: 28px 0 20px; }
    .app-header h1 { font-size: 1.5rem; font-weight: 800; color: var(--green); letter-spacing: -.02em; }
    .app-header p  { font-size: .85rem; color: var(--muted); margin-top: 4px; }

    /* ---- Lesson List ---- */
    .btn-all {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 15px;
      background: var(--green); color: #fff;
      border: none; border-radius: var(--r-md);
      font-size: 1rem; font-weight: 700; cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: opacity .15s;
      margin-bottom: 14px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-all:hover { opacity: .88; }
    .lesson-item {
      display: flex; align-items: center; gap: 14px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--r-md);
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color .15s, transform .15s, box-shadow .15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    @media (hover: hover) {
      .lesson-item:hover { border-color: var(--green); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    }
    .lesson-icon  { font-size: 1.6rem; flex-shrink: 0; }
    .lesson-title { font-size: .9rem; font-weight: 700; }
    .lesson-meta  { font-size: .75rem; color: var(--muted); margin-top: 2px; }

    /* ---- Setup Screen ---- */
    .btn-back {
      display: flex; align-items: center; gap: 5px;
      background: none; border: none;
      color: var(--muted); font-size: .875rem;
      cursor: pointer; padding: 6px 0; margin-bottom: 14px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-back:hover { color: var(--text); }
    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 14px 16px;
      margin-bottom: 4px;
    }
    .info-card-title { font-size: .95rem; font-weight: 700; }
    .info-card-sub   { font-size: .78rem; color: var(--muted); margin-top: 3px; }
    .section-label {
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--muted);
      margin: 18px 0 8px;
    }
    .filter-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-btn {
      padding: 8px 16px;
      border: 2px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-size: .82rem; color: var(--text);
      cursor: pointer; transition: all .15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .filter-btn.active {
      border-color: var(--green);
      background: var(--green-light);
      color: var(--green); font-weight: 700;
    }
    .toggle-row { display: flex; gap: 8px; }
    .toggle-btn {
      flex: 1; padding: 11px 8px;
      border: 2px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--surface);
      font-size: .82rem; color: var(--text); text-align: center;
      cursor: pointer; transition: all .15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .toggle-btn.active {
      border-color: var(--blue);
      background: var(--blue-light);
      color: var(--blue); font-weight: 700;
    }
    .weak-row { display: none; margin-top: 14px; }
    .weak-row label {
      display: flex; align-items: center; gap: 10px;
      font-size: .875rem; cursor: pointer;
    }
    .weak-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--green); flex-shrink: 0; }
    .count-hint {
      font-size: .82rem; color: var(--muted);
      text-align: center; margin-top: 10px;
    }
    .btn-start {
      width: 100%; padding: 17px;
      background: var(--green); color: #fff;
      border: none; border-radius: var(--r-md);
      font-size: 1.05rem; font-weight: 800;
      cursor: pointer; margin-top: 22px;
      box-shadow: var(--shadow-md);
      transition: opacity .15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-start:hover   { opacity: .88; }
    .btn-start:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

    /* ---- Study Screen ---- */
    .progress-wrap { margin-bottom: 6px; }
    .progress-bar {
      height: 6px; background: var(--border);
      border-radius: 999px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--green);
      border-radius: 999px;
      transition: width .35s ease;
    }
    .progress-label {
      font-size: .78rem; color: var(--muted);
      text-align: center; margin: 5px 0 16px;
    }

    /* 3-D card */
    .card-scene {
      perspective: 1100px;
      height: clamp(240px, 48vw, 300px);
      margin-bottom: 16px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .card-3d {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.4,0,.2,1);
    }
    .card-3d.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-lg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 20px;
    }
    .card-front {
      background: var(--surface);
      border: 2px solid var(--border);
    }
    .card-back {
      background: var(--surface);
      border: 2px solid var(--green);
      transform: rotateY(180deg);
      justify-content: flex-start;
      padding-top: 22px;
      overflow-y: auto;
    }
    .cat-badge {
      font-size: .68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      padding: 3px 10px; border-radius: 999px;
      margin-bottom: 12px; flex-shrink: 0;
      background: var(--blue-light); color: var(--blue);
    }
    .front-text {
      font-size: clamp(1.2rem, 4vw, 1.55rem);
      font-weight: 800;
      text-align: center; line-height: 1.3;
    }
    .front-hint { font-size: .78rem; color: var(--muted); margin-top: 12px; }

    .back-meaning {
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      font-weight: 800;
      color: var(--green); text-align: center;
      min-width: 0;
    }
    .back-example {
      font-size: .875rem; font-style: italic;
      text-align: center; line-height: 1.65;
      min-width: 0;
      white-space: pre-line;
    }

    /* ---- Speech buttons ---- */
    .speak-row {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; width: 100%;
    }
    .speak-row.top { align-items: flex-start; }
    #cb-meaning-row { margin-bottom: 12px; }
    #cb-example-row { margin-bottom: 4px; }

    .btn-speak {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; flex-shrink: 0; padding: 0;
      background: var(--surface); color: var(--blue);
      border: 1.5px solid var(--border); border-radius: 50%;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s, transform .12s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-speak svg { width: 18px; height: 18px; }
    .btn-speak.sm       { width: 28px; height: 28px; }
    .btn-speak.sm svg   { width: 15px; height: 15px; }
    @media (hover: hover) {
      .btn-speak:hover { border-color: var(--blue); background: var(--blue-light); }
    }
    .btn-speak:active { transform: scale(.92); }
    .btn-speak.speaking {
      border-color: var(--blue); background: var(--blue); color: #fff;
    }
    .btn-speak-corner { position: absolute; top: 12px; right: 12px; }
    body.no-speech .btn-speak { display: none !important; }
    .back-example-ja {
      font-size: .78rem; color: var(--muted);
      text-align: center; margin-bottom: 10px;
      width: 100%; white-space: pre-line;
    }
    .back-notes {
      font-size: .73rem; color: var(--muted);
      background: var(--bg); border-radius: var(--r-sm);
      padding: 6px 12px; width: 100%; text-align: center;
    }

    /* Action buttons */
    .btn-reveal {
      width: 100%; padding: 15px;
      background: var(--blue); color: #fff;
      border: none; border-radius: var(--r-md);
      font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: opacity .15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-reveal:hover { opacity: .88; }
    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-again {
      padding: 15px;
      background: var(--red-light); color: #dc2626;
      border: 2px solid var(--red-border);
      border-radius: var(--r-md);
      font-size: .95rem; font-weight: 700;
      cursor: pointer; transition: background .15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-again:active { background: #fecaca; }
    .btn-known {
      padding: 15px;
      background: var(--green-light); color: var(--green);
      border: 2px solid var(--green-border);
      border-radius: var(--r-md);
      font-size: .95rem; font-weight: 700;
      cursor: pointer; transition: background .15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-known:active { background: #bbf7d0; }

    /* ---- Complete Screen ---- */
    .complete-emoji  { font-size: 3.2rem; text-align: center; margin: 24px 0 6px; }
    .complete-title  { font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 4px; }
    .complete-sub    { font-size: .9rem; color: var(--muted); text-align: center; margin-bottom: 26px; }
    .stats-row       { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .stat-box {
      background: var(--surface); border: 2px solid var(--border);
      border-radius: var(--r-md); padding: 16px; text-align: center;
    }
    .stat-box.known  { border-color: var(--green-border); background: var(--green-light); }
    .stat-box.again  { border-color: var(--red-border);   background: var(--red-light);   }
    .stat-num  { font-size: 2.2rem; font-weight: 900; }
    .stat-box.known .stat-num { color: var(--green); }
    .stat-box.again .stat-num { color: #dc2626; }
    .stat-lbl  { font-size: .78rem; color: var(--muted); margin-top: 2px; }

    .btn-secondary {
      width: 100%; padding: 14px; margin-bottom: 10px;
      background: var(--surface); color: var(--text);
      border: 2px solid var(--border); border-radius: var(--r-md);
      font-size: .95rem; font-weight: 700; cursor: pointer;
      transition: border-color .15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-secondary:hover    { border-color: var(--green); }
    .btn-secondary:disabled { opacity: .38; cursor: not-allowed; }
    .btn-primary {
      width: 100%; padding: 14px;
      background: var(--green); color: #fff;
      border: none; border-radius: var(--r-md);
      font-size: .95rem; font-weight: 700; cursor: pointer;
      transition: opacity .15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary:hover { opacity: .88; }

    /* ---- Small screen tweaks ---- */
    @media (max-width: 380px) {
      .app-header h1 { font-size: 1.25rem; }
      .app-header    { padding: 20px 0 14px; }
      .card-face     { padding: 18px 16px; }
      .action-row    { gap: 8px; }
      .btn-again, .btn-known { padding: 13px 8px; font-size: .88rem; }
    }
  </style>
</head>
<body>

<!-- ============================================================
     Screen: Home
     ============================================================ -->
<div id="screen-home" class="screen active">
  <div class="container">
    <div class="app-header">
      <h1>🇧🇷 ポルトガル語</h1>
      <p>フラッシュカード復習アプリ</p>
    </div>

    <button class="btn-all" onclick="App.selectAll()">
      🌟 全レッスンまとめて学習
    </button>

    <div id="lesson-list"></div>
  </div>
</div>

<!-- ============================================================
     Screen: Setup
     ============================================================ -->
<div id="screen-setup" class="screen">
  <div class="container">
    <button class="btn-back" onclick="App.showHome()">← 戻る</button>

    <div class="info-card">
      <div class="info-card-title" id="setup-title"></div>
      <div class="info-card-sub"   id="setup-sub"></div>
    </div>

    <div class="section-label">カテゴリ</div>
    <div class="filter-wrap" id="category-filters"></div>

    <div class="section-label">モード</div>
    <div class="toggle-row">
      <button class="toggle-btn active" id="mode-f2b" onclick="App.setMode('f2b')">🇧🇷 → 🇯🇵</button>
      <button class="toggle-btn"        id="mode-b2f" onclick="App.setMode('b2f')">🇯🇵 → 🇧🇷</button>
    </div>

    <div class="section-label">順番</div>
    <div class="toggle-row">
      <button class="toggle-btn active" id="order-seq"  onclick="App.setOrder('seq')">順番通り</button>
      <button class="toggle-btn"        id="order-rand" onclick="App.setOrder('rand')">ランダム</button>
    </div>

    <div class="weak-row" id="weak-row">
      <label>
        <input type="checkbox" id="weak-only" onchange="App.updateCount()">
        苦手なカードだけ復習
      </label>
    </div>

    <div class="count-hint" id="count-hint"></div>
    <button class="btn-start" id="btn-start" onclick="App.startSession()">学習スタート</button>
  </div>
</div>

<!-- ============================================================
     Screen: Study
     ============================================================ -->
<div id="screen-study" class="screen">
  <div class="container">
    <button class="btn-back" onclick="App.showHome()">← ホーム</button>

    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="prog-fill" style="width:0%"></div>
      </div>
    </div>
    <div class="progress-label" id="prog-label"></div>

    <div class="card-scene" id="card-scene" onclick="App.onCardTap()">
      <div class="card-3d" id="card-3d">

        <div class="card-face card-front">
          <button class="btn-speak btn-speak-corner" id="cf-speak"
                  onclick="App.speak(event,'front')" aria-label="ポルトガル語を読み上げる">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 5 6 9H3v6h3l5 4z"/>
              <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
              <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
            </svg>
          </button>
          <div class="cat-badge" id="cf-badge"></div>
          <div class="front-text"  id="cf-text"></div>
          <div class="front-hint"  id="cf-hint">タップして確認</div>
        </div>

        <div class="card-face card-back">
          <div class="cat-badge" id="cb-badge"></div>

          <div class="speak-row" id="cb-meaning-row">
            <div class="back-meaning" id="cb-meaning"></div>
            <button class="btn-speak sm" id="cb-speak-term"
                    onclick="App.speak(event,'term')" aria-label="単語を読み上げる">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 5 6 9H3v6h3l5 4z"/>
                <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
              </svg>
            </button>
          </div>

          <div class="speak-row top" id="cb-example-row">
            <div class="back-example" id="cb-example"></div>
            <button class="btn-speak sm" id="cb-speak-ex"
                    onclick="App.speak(event,'example')" aria-label="例文を読み上げる">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 5 6 9H3v6h3l5 4z"/>
                <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
              </svg>
            </button>
          </div>

          <div class="back-example-ja" id="cb-example-ja"></div>
          <div class="back-notes"      id="cb-notes"></div>
        </div>

      </div>
    </div>

    <div id="wrap-reveal">
      <button class="btn-reveal" onclick="App.flip()">確認する</button>
    </div>
    <div id="wrap-actions" class="action-row" style="display:none;">
      <button class="btn-again" onclick="App.mark('again')">↺ もう一度</button>
      <button class="btn-known" onclick="App.mark('known')">✓ 覚えた</button>
    </div>
  </div>
</div>

<!-- ============================================================
     Screen: Complete
     ============================================================ -->
<div id="screen-complete" class="screen">
  <div class="container">
    <div class="complete-emoji" id="cmp-emoji"></div>
    <div class="complete-title" id="cmp-title"></div>
    <div class="complete-sub"   id="cmp-sub"></div>

    <div class="stats-row">
      <div class="stat-box known">
        <div class="stat-num" id="cmp-known">0</div>
        <div class="stat-lbl">覚えた</div>
      </div>
      <div class="stat-box again">
        <div class="stat-num" id="cmp-again">0</div>
        <div class="stat-lbl">もう一度</div>
      </div>
    </div>

    <button class="btn-secondary" id="btn-redo" onclick="App.redoWeak()">苦手カードだけ再学習</button>
    <button class="btn-secondary"               onclick="App.restart()">最初からやり直す</button>
    <button class="btn-primary"                 onclick="App.showHome()">ホームに戻る</button>
  </div>
</div>

<!-- ============================================================
     Scripts
     ============================================================ -->
<script src="lessons-index.js"></script>
<script>
const CATEGORY_LABELS = {
  vocabulary:  '単語・表現',
  phrase:      'フレーズ',
  connector:   '接続詞',
  reformular:  '言い換え',
};

// ---- ポルトガル語読み上げ（Web Speech API）----
// 日本語文字を含むカード（文法解説など）はラテン文字部分だけを読み上げる
const JP_CHARS = /[　-〿぀-ヿㇰ-ㇿ一-鿿＀-￯]/g;

function speakableText(s) {
  if (!s) return '';
  const t = String(s)
    .replace(JP_CHARS, ' ')
    .replace(/[+＝=]+\s*$/, '')
    .replace(/\s+/g, ' ')
    .trim();
  // ラテン文字が2文字以上残っていなければ読み上げ対象にしない
  return /[a-zA-ZÀ-ÿ]{2,}/.test(t) ? t : '';
}

const Speech = {
  supported: 'speechSynthesis' in window,
  voice: null,
  btn:   null,
  _u:    null,

  init() {
    if (!this.supported) { document.body.classList.add('no-speech'); return; }
    const pick = () => {
      const vs = speechSynthesis.getVoices() || [];
      this.voice = vs.find(v => /^pt[-_]BR$/i.test(v.lang))
                || vs.find(v => /^pt/i.test(v.lang))
                || null;
    };
    pick();
    speechSynthesis.addEventListener('voiceschanged', pick);
  },

  _clear() {
    if (this.btn) this.btn.classList.remove('speaking');
    this.btn = null;
  },

  stop() {
    if (!this.supported) return;
    this._u = null;
    speechSynthesis.cancel();
    this._clear();
  },

  speak(text, btn) {
    if (!this.supported || !text) return;
    // 再生中の同じボタンをもう一度押したら停止
    const isSame = this.btn === btn && (speechSynthesis.speaking || speechSynthesis.pending);
    this.stop();
    if (isSame) return;

    const u = new SpeechSynthesisUtterance(text);
    u.lang = this.voice ? this.voice.lang : 'pt-BR';
    if (this.voice) u.voice = this.voice;
    u.rate = .92;
    u.onend = u.onerror = () => { if (this._u === u) this._clear(); };

    this._u  = u;
    this.btn = btn;
    if (btn) btn.classList.add('speaking');
    speechSynthesis.speak(u);
  },
};

const Progress = {
  get()              { try { return JSON.parse(localStorage.getItem('pt_progress') || '{}'); } catch { return {}; } },
  save(cardId, stat) { const p = this.get(); p[cardId] = { stat, date: new Date().toISOString().slice(0,10) }; localStorage.setItem('pt_progress', JSON.stringify(p)); },
  isWeak(cardId)     { return this.get()[cardId]?.stat === 'again'; },
  hasAnyWeak(cards)  { return cards.some(c => this.isWeak(c.id)); },
};

const state = {
  lessonIds:    [],
  loaded:       {},
  allCards:     [],
  sessionCards: [],
  idx:          0,
  flipped:      false,
  mode:         'f2b',
  order:        'seq',
  selCats:      new Set(['all']),
  results:      [],
  speakTexts:   { front: '', term: '', example: '' },
};

function show(id) {
  Speech.stop();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function loadScript(lesson) {
  return new Promise((resolve, reject) => {
    if (window[lesson.dataVar]) { state.loaded[lesson.id] = window[lesson.dataVar]; resolve(); return; }
    if (state.loaded[lesson.id]) { resolve(); return; }
    const s = document.createElement('script');
    s.src = lesson.dataPath;
    s.onload  = () => { state.loaded[lesson.id] = window[lesson.dataVar]; resolve(); };
    s.onerror = () => reject(new Error('読み込み失敗: ' + lesson.dataPath));
    document.head.appendChild(s);
  });
}

const App = {

  showHome() {
    document.getElementById('lesson-list').innerHTML = LESSONS_INDEX.map(l => `
      <div class="lesson-item" onclick="App.selectLesson('${l.id}')">
        <div class="lesson-icon">📚</div>
        <div>
          <div class="lesson-title">${l.title}</div>
          <div class="lesson-meta">${l.date} · ${l.theme}</div>
        </div>
      </div>
    `).join('');
    show('screen-home');
  },

  async selectLesson(id) {
    const lesson = LESSONS_INDEX.find(l => l.id === id);
    try {
      await loadScript(lesson);
      state.lessonIds = [id];
      this._buildAllCards();
      this._showSetup();
    } catch(e) { alert(e.message); }
  },

  async selectAll() {
    try {
      await Promise.all(LESSONS_INDEX.map(loadScript));
      state.lessonIds = LESSONS_INDEX.map(l => l.id);
      this._buildAllCards();
      this._showSetup();
    } catch(e) { alert(e.message); }
  },

  _buildAllCards() {
    state.allCards = [];
    for (const id of state.lessonIds) {
      const data = state.loaded[id];
      if (data) data.cards.forEach(c => state.allCards.push({ ...c, _lessonId: id }));
    }
  },

  _showSetup() {
    const total = state.allCards.length;
    if (state.lessonIds.length === 1) {
      const l = LESSONS_INDEX.find(x => x.id === state.lessonIds[0]);
      document.getElementById('setup-title').textContent = l.title;
      document.getElementById('setup-sub').textContent   = `${l.date} · ${total}枚`;
    } else {
      document.getElementById('setup-title').textContent = '🌟 全レッスンまとめて学習';
      document.getElementById('setup-sub').textContent   = `${state.lessonIds.length}レッスン · ${total}枚`;
    }

    const cats = [...new Set(state.allCards.map(c => c.category))];
    state.selCats = new Set(['all']);
    document.getElementById('category-filters').innerHTML = [
      `<button class="filter-btn active" data-cat="all" onclick="App.toggleCat('all')">全て (${total})</button>`,
      ...cats.map(cat => {
        const n = state.allCards.filter(c => c.category === cat).length;
        return `<button class="filter-btn" data-cat="${cat}" onclick="App.toggleCat('${cat}')">${CATEGORY_LABELS[cat] || cat} (${n})</button>`;
      })
    ].join('');

    this.setMode('f2b');
    this.setOrder('seq');
    document.getElementById('weak-only').checked = false;
    document.getElementById('weak-row').style.display = Progress.hasAnyWeak(state.allCards) ? 'block' : 'none';
    this.updateCount();
    show('screen-setup');
  },

  toggleCat(cat) {
    if (cat === 'all') {
      state.selCats = new Set(['all']);
    } else {
      state.selCats.delete('all');
      if (state.selCats.has(cat)) {
        state.selCats.delete(cat);
        if (state.selCats.size === 0) state.selCats = new Set(['all']);
      } else {
        state.selCats.add(cat);
        const allCats = [...new Set(state.allCards.map(c => c.category))];
        if (state.selCats.size === allCats.length) state.selCats = new Set(['all']);
      }
    }
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', state.selCats.has(b.dataset.cat)));
    this.updateCount();
  },

  setMode(m) {
    state.mode = m;
    document.getElementById('mode-f2b').classList.toggle('active', m === 'f2b');
    document.getElementById('mode-b2f').classList.toggle('active', m === 'b2f');
  },

  setOrder(o) {
    state.order = o;
    document.getElementById('order-seq') .classList.toggle('active', o === 'seq');
    document.getElementById('order-rand').classList.toggle('active', o === 'rand');
  },

  _filtered() {
    let cards = state.selCats.has('all')
      ? state.allCards
      : state.allCards.filter(c => state.selCats.has(c.category));
    if (document.getElementById('weak-only').checked)
      cards = cards.filter(c => Progress.isWeak(c.id));
    return cards;
  },

  updateCount() {
    const n = this._filtered().length;
    document.getElementById('count-hint').textContent  = `${n}枚のカードで学習します`;
    document.getElementById('btn-start').disabled = n === 0;
  },

  startSession() {
    let cards = this._filtered();
    if (!cards.length) return;
    if (state.order === 'rand') cards = [...cards].sort(() => Math.random() - .5);
    state.sessionCards = cards;
    state.idx     = 0;
    state.results = [];
    state.flipped = false;
    show('screen-study');
    this._renderCard(0);
  },

  _renderCard(i) {
    const card  = state.sessionCards[i];
    const total = state.sessionCards.length;
    state.flipped = false;
    Speech.stop();
    document.getElementById('card-3d').classList.remove('flipped');

    document.getElementById('prog-fill').style.width  = (i / total * 100) + '%';
    document.getElementById('prog-label').textContent = `${i + 1} / ${total}`;

    const label = CATEGORY_LABELS[card.category] || card.category;
    document.getElementById('cf-badge').textContent = label;
    document.getElementById('cb-badge').textContent = label;

    const isBtoF = state.mode === 'b2f';
    document.getElementById('cf-text').textContent    = isBtoF ? card.back  : card.front;
    document.getElementById('cb-meaning').textContent = isBtoF ? card.front : card.back;

    const exPt  = card.example_pt || '';
    const exJa  = card.example_ja || '';
    const notes = card.notes || '';
    document.getElementById('cb-example')    .textContent   = exPt;
    document.getElementById('cb-example-row').style.display = exPt   ? 'flex' : 'none';
    document.getElementById('cb-example-ja').textContent    = exJa;
    document.getElementById('cb-example-ja').style.display  = exJa   ? '' : 'none';
    document.getElementById('cb-notes')     .textContent    = notes;
    document.getElementById('cb-notes')     .style.display  = notes  ? '' : 'none';

    // 読み上げ（ポルトガル語のみ）
    // 表面は日本語→ポルトガル語モードのとき答えを漏らさないよう非表示にする
    const term = speakableText(card.front);
    state.speakTexts = {
      front:   isBtoF ? '' : term,
      term:    term,
      example: speakableText(exPt),
    };
    document.getElementById('cf-speak')     .style.display = state.speakTexts.front   ? '' : 'none';
    document.getElementById('cb-speak-term').style.display = state.speakTexts.term    ? '' : 'none';
    document.getElementById('cb-speak-ex')  .style.display = state.speakTexts.example ? '' : 'none';

    document.getElementById('wrap-reveal') .style.display = '';
    document.getElementById('wrap-actions').style.display = 'none';
  },

  speak(ev, which) {
    ev.stopPropagation();
    Speech.speak(state.speakTexts[which] || '', ev.currentTarget);
  },

  onCardTap() {
    if (!state.flipped) this.flip(); else this.unflip();
  },

  unflip() {
    state.flipped = false;
    document.getElementById('card-3d').classList.remove('flipped');
    document.getElementById('wrap-reveal').style.display = '';
    document.getElementById('wrap-actions').style.display = 'none';
  },

  flip() {
    if (state.flipped) return;
    state.flipped = true;
    document.getElementById('card-3d').classList.add('flipped');
    document.getElementById('wrap-reveal') .style.display = 'none';
    document.getElementById('wrap-actions').style.display = 'grid';
  },

  mark(stat) {
    const card = state.sessionCards[state.idx];
    state.results.push({ id: card.id, stat });
    Progress.save(card.id, stat);
    state.idx++;
    if (state.idx >= state.sessionCards.length) {
      this._showComplete();
    } else {
      setTimeout(() => this._renderCard(state.idx), 80);
    }
  },

  _showComplete() {
    const known = state.results.filter(r => r.stat === 'known').length;
    const again = state.results.filter(r => r.stat === 'again').length;
    const pct   = Math.round(known / state.results.length * 100);

    document.getElementById('prog-fill').style.width = '100%';

    const [emoji, title] =
      pct === 100 ? ['🎉', '完璧！'] :
      pct >= 70   ? ['👍', 'よくできました！'] :
                    ['💪', 'もう少し！'];

    document.getElementById('cmp-emoji').textContent = emoji;
    document.getElementById('cmp-title').textContent = title;
    document.getElementById('cmp-sub')  .textContent = `正解率 ${pct}%（${known}/${state.results.length}枚）`;
    document.getElementById('cmp-known').textContent = known;
    document.getElementById('cmp-again').textContent = again;
    document.getElementById('btn-redo').disabled = again === 0;
    show('screen-complete');
  },

  redoWeak() {
    const weakIds = new Set(state.results.filter(r => r.stat === 'again').map(r => r.id));
    let cards = state.sessionCards.filter(c => weakIds.has(c.id));
    if (state.order === 'rand') cards = [...cards].sort(() => Math.random() - .5);
    state.sessionCards = cards;
    state.idx = 0; state.results = []; state.flipped = false;
    show('screen-study');
    this._renderCard(0);
  },

  restart() { this.startSession(); },
};

Speech.init();
App.showHome();
</script>
